[project]
name = "climatoology"
version = "7.4.2"
description = "This package provides the underlying functionality to implement Climate Action Operators and Plugins and to interact with the backend."
authors = [
    { name = "Moritz Schott", email = "moritz.schott@heigit.org" },
    { name = "Danielle Gatland", email = "danielle.gatland@heigit.org" },
    { name = "Maciej Adamiak", email = "maciej.adamiak@heigit.org" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic (>=2.0.0,<3.0.0)",
    "pydantic-extra-types (>=2.0.0,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "geojson-pydantic (>=2.0.0,<3.0.0)",
    "shapely (>=2.0.0,<3.0.0)",
    "pydantic-shapely (>=1.0.0a1,<2.0.0)",
    "pyproj (>=3.0.0,<4.0.0)",
    "affine (>=3.0.0,<4.0.0)",
    "bibtexparser (>=2.0.0,<3.0.0)",
    "semver (>=3.0.0,<4.0.0)",
    "rasterio (>=1.0.0,<2.0.0)",
    "sentinelhub (>=3.0.0,<4.0.0)",
    "tqdm (>=4.0.0,<5.0.0)",
    "requests (>=2.0.0,<3.0.0)",
    "urllib3 (>=2.0.0,<3.0.0)",
    "pillow (>=12.0.0,<13.0.0)",
    "pandas (>=2.0.0,<4.0.0)",
    "geopandas (>=1.0.0,<2.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "celery[sqlalchemy] (>=5.0.0,<6.0.0)",
    "kombu (>=5.0.0,<6.0.0)",
    "sqlalchemy[postgresql-psycopgbinary] (>=2.0.0,<3.0.0)",
    "sqlalchemy-utils (>=0.42.0,<0.43.0)",
    "geoalchemy2 (>=0.20.0,<0.21.0)",
    "alembic (>=1.0.0,<2.0.0)",
    "alembic-utils (>=0.8.0,<0.9.0)",
    "alembic-postgresql-enum (>=1.0.0,<2.0.0)",
    "plotly (>=7.0.0,<8.0.0)",
    "rasterstats (>=0.21.0,<0.22.0)",
    "pycountry (>=26.0.0,<27.0.0)",
    "babel (>=2.0.0,<3.0.0)",
    "boto3 (>=1.0.0,<2.0.0)",
]

[project.optional-dependencies]
fixtures = [
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-mock (>=3.0.0,<4.0.0)",
    "pytest-alembic (>=0.13.0,<0.14.0)",
    "pytest-postgresql (>=9.0.0,<10.0.0)",
    "moto[s3] (>=5.0.0,<6.0.0)",
    "freezegun (>=1.0.0,<2.0.0)",
    "responses (>=0.26.0,<0.27.0)"
]

[project.scripts]
alembic-config-location = 'climatoology.store.database.migration.alembic_config_discovery:discover'

[project.urls]
repository = "https://gitlab.heigit.org/climate-action/climatoology"

[dependency-groups]
test = [
    "pytest-cov (>=7.0.0,<8.0.0)",
]
dev = [
    "pre-commit (>=4.0.0,<5.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "pandas-stubs (>=3.0.0.260204,<4.0.0.0)",
    "boto3-stubs (>=1.0.0,<2.0.0)"
]

[tool.alembic]
script_location = "%(here)s/climatoology/store/database/migration"
prepend_sys_path = [
    "."
]
file_template = "%%(year)d-%%(month).2d-%%(day).2dT%%(hour).2d-%%(minute).2d_%%(rev)s_%%(slug)s"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules
select = [
    # defaults
    "F",
    "E4", "E7", "E9",
    # additional
    "A", # be sure not to shadow built-in functions
    "I", # isort to sort imports
    "N", # check for use of PEP8 naming conventions
    # docstring cleaning
    "D201", "D207", "D208", "D209", "D210", "D214", "D215", "D300", "D403",
    # auto-remove unused 'noqa' comments
    "RUF100", "RUF101",
]

[tool.coverage.run]
omit = ["test/*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
